# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds

# Add stuff here
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above
bind = Super, Z, togglesplit
bind = Super+Shift, U, exec, ~/bin/reset-mouse
bind = Super, Y, exec, hyprctl keyword monitor "eDP-1,disable"
bind = Super+Shift, Y, exec, hyprctl keyword monitor "eDP-1,preferred,0x0,1"
#bind = Alt, F, exec, ~/.config/hypr/custom/scripts/brave_top_edge_f11.sh # Toggle Brave F11, then wait at top to toggle again
#bind = Super, P, exec, ~/bin/nonogram
#bind = Super, P, pin, active
unbind = Super, P
bind = SUPER, P, exec, hyprctl dispatch togglefloating active; hyprctl dispatch pin active

##! Upstream Overrides
# Unbind upstream defaults that are replaced or removed below

# Super+Tab: cycle active workspaces instead of overview toggle
unbind = Super, Tab
bind = Super, Tab, exec, ~/.config/hypr/hyprland/scripts/cycle_active_workspaces.sh # Cycle through active workspaces

# Remove on-screen keyboard toggle (K freed for movefocus up)
unbind = Super, K

# Bar toggle moved from J to U (J freed for movefocus down)
unbind = Super, J
bindd = Super, U, Toggle bar, global, quickshell:barToggle # Toggle bar

# Panel cycle moved from Ctrl+Super+P to Super+Alt+W
unbind = Ctrl+Super, P
bind = Super+Alt, W, global, quickshell:panelFamilyCycle # Cycle panel family

# Widget restart: also reload hyprland and kill legacy ags
unbind = Ctrl+Super, R
bind = Ctrl+Super, R, exec, hyprctl reload; killall ags agsv1 gjs ydotool qs quickshell; qs -c $qsConfig & # Restart widgets

# OCR: use regionOcr instead of screenTranslate on Super+Shift+T
unbind = Super+Shift, T
bind = Super+Shift, T, global, quickshell:regionOcr # [hidden]
bind = Super+Shift, T, exec, qs -c $qsConfig ipc call TEST_ALIVE || pidof slurp || grim -g "$(slurp $SLURP_ARGS)" "/tmp/ocr_image.png" && tesseract "/tmp/ocr_image.png" stdout -l $(tesseract --list-langs | awk 'NR>1{print $1}' | tr '\\n' '+' | sed 's/\\+$/\\n/') | wl-copy && rm "/tmp/ocr_image.png" # [hidden]

# Screenshot: full screen instead of active-monitor-only
unbind = , Print
unbind = Ctrl, Print
bindl = ,Print, exec, grim - | wl-copy # Screenshot >> clipboard
bindln = Ctrl,Print, exec, mkdir -p $(xdg-user-dir PICTURES)/Screenshots && grim $(xdg-user-dir PICTURES)/Screenshots/Screenshot_"$(date '+%Y-%m-%d_%H.%M.%S')".png # Screenshot >> clipboard & file (file)
bindln = Ctrl,Print, exec, grim - | wl-copy # [hidden] Screenshot >> clipboard & file (clipboard)

# Window focus: hjkl instead of BracketLeft/Right
unbind = Super, BracketLeft
unbind = Super, BracketRight
#/# bind = Super, h/k/l/j,, # Focus in direction
bind = Super, h, movefocus, l # [hidden]
bind = Super, k, movefocus, u # [hidden]
bind = Super, j, movefocus, d # [hidden]

# Super+l for movefocus right; L (lock) moved to Super+O below
unbind = Super, L
bind = Super, l, movefocus, r # [hidden]

# Split ratio: use splitratio dispatcher directly
unbind = Super, Semicolon
unbind = Super, Apostrophe
binde = Super, Semicolon, splitratio, -0.1 # [hidden]
binde = Super, Apostrophe, splitratio, +0.1 # [hidden]

# Send to workspace: Super+Shift instead of Super+Alt
unbind = Super+Alt, code:10
unbind = Super+Alt, code:11
unbind = Super+Alt, code:12
unbind = Super+Alt, code:13
unbind = Super+Alt, code:14
unbind = Super+Alt, code:15
unbind = Super+Alt, code:16
unbind = Super+Alt, code:17
unbind = Super+Alt, code:18
unbind = Super+Alt, code:19
#/# bind = Super+Shift, Hash,, # Send to workspace # (1, 2, 3,...)
bind = Super+Shift, code:10, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 1 # [hidden]
bind = Super+Shift, code:11, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 2 # [hidden]
bind = Super+Shift, code:12, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 3 # [hidden]
bind = Super+Shift, code:13, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 4 # [hidden]
bind = Super+Shift, code:14, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 5 # [hidden]
bind = Super+Shift, code:15, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 6 # [hidden]
bind = Super+Shift, code:16, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 7 # [hidden]
bind = Super+Shift, code:17, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 8 # [hidden]
bind = Super+Shift, code:18, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 9 # [hidden]
bind = Super+Shift, code:19, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 10 # [hidden]
# keypad
unbind = Super+Alt, code:87
unbind = Super+Alt, code:88
unbind = Super+Alt, code:89
unbind = Super+Alt, code:83
unbind = Super+Alt, code:84
unbind = Super+Alt, code:85
unbind = Super+Alt, code:79
unbind = Super+Alt, code:80
unbind = Super+Alt, code:81
unbind = Super+Alt, code:90
bind = Super+Shift, code:87, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 1  # [hidden]
bind = Super+Shift, code:88, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 2  # [hidden]
bind = Super+Shift, code:89, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 3  # [hidden]
bind = Super+Shift, code:83, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 4  # [hidden]
bind = Super+Shift, code:84, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 5  # [hidden]
bind = Super+Shift, code:85, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 6  # [hidden]
bind = Super+Shift, code:79, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 7  # [hidden]
bind = Super+Shift, code:80, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 8  # [hidden]
bind = Super+Shift, code:81, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 9  # [hidden]
bind = Super+Shift, code:90, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 10 # [hidden]

# Remove Super+Alt scroll/page send-to-workspace binds
unbind = Super+Alt, mouse_down
unbind = Super+Alt, mouse_up
unbind = Super+Alt, Page_Down
unbind = Super+Alt, Page_Up

# Lock/sleep: O instead of L (L freed for movefocus right above)
unbind = Super+Shift, L
unbind = Super, O
bindd = Super, O, Lock, exec, loginctl lock-session # Lock
bindld = Super+Shift, O, Suspend system, exec, systemctl suspend || loginctl suspend # Sleep
bindl=,switch:on:Lid Switch, exec, systemctl suspend || loginctl suspend # [hidden] Suspend when laptop lid is closed

# Zoom: use qs ipc with fallback
unbind = Super, Minus
unbind = Super, Equal
binde = Super, Minus, exec, qs -c $qsConfig ipc call zoom zoomOut # Zoom out
binde = Super, Equal, exec, qs -c $qsConfig ipc call zoom zoomIn # Zoom in
binde = Super, Minus, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh decrease 0.1 # [hidden] Zoom out
binde = Super, Equal, exec, qs -c $qsConfig ipc call TEST_ALIVE || ~/.config/hypr/hyprland/scripts/zoom.sh increase 0.1 # [hidden] Zoom in

# App launchers: use launch_first_available.sh instead of $variable
unbind = Super, Return
unbind = Super, T
unbind = Ctrl+Alt, T
unbind = Super, E
unbind = Super, W
unbind = Super, C
unbind = Ctrl+Super+Shift+Alt, W
unbind = Super, X
unbind = Ctrl+Super, V
unbind = Super, I
unbind = Ctrl+Shift, Escape
bind = Super, Return, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "kitty -1" "foot" "alacritty" "wezterm" "konsole" "kgx" "uxterm" "xterm" # Terminal
bind = Super, T, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "kitty -1" "foot" "alacritty" "wezterm" "konsole" "kgx" "uxterm" "xterm" # [hidden] (terminal) (alt)
bind = Ctrl+Alt, T, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "kitty -1" "foot" "alacritty" "wezterm" "konsole" "kgx" "uxterm" "xterm" # [hidden] (terminal) (for Ubuntu people)
bind = Super, E, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "dolphin" "nautilus" "nemo" "thunar" "${TERMINAL}" "kitty -1 fish -c yazi" # File manager
bind = Super, W, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "google-chrome-stable" "zen-browser" "firefox" "brave" "chromium" "microsoft-edge-stable" "opera" "librewolf" # Browser
bind = Super, C, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "code" "codium" "cursor" "zed" "zedit" "zeditor" "kate" "gnome-text-editor" "emacs" "command -v nvim && kitty -1 nvim" "command -v micro && kitty -1 micro" # Code editor
bind = Ctrl+Super+Shift+Alt, W, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "wps" "onlyoffice-desktopeditors" "libreoffice" # Office software
bind = Super, X, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "kate" "gnome-text-editor" "emacs" # Text editor
bind = Ctrl+Super, V, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "pavucontrol-qt" "pavucontrol" # Volume mixer
bind = Super, I, exec, XDG_CURRENT_DESKTOP=gnome ~/.config/hypr/hyprland/scripts/launch_first_available.sh "qs -p ~/.config/quickshell/$qsConfig/settings.qml" "systemsettings" "gnome-control-center" "better-control" # Settings app
bind = Ctrl+Shift, Escape, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "gnome-system-monitor" "plasma-systemmonitor --page-name Processes" "command -v btop && kitty -1 fish -c btop" # Task manager
